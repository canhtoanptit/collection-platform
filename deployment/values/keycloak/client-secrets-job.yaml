# kcadm Job: set the M2M client secrets, then assert the realm matches the file.
#
# WHY A JOB AND NOT REALM-JSON PLACEHOLDERS
# -----------------------------------------
# Keycloak *does* support `${VAR}` placeholder substitution in realm import files
# (https://www.keycloak.org/server/importExport). We deliberately do not use it
# for client secrets, for two reasons:
#
#  1. Placeholder substitution resolves from the **Keycloak server's own
#     environment**, so both client secrets would have to be env vars on a
#     long-lived StatefulSet pod, readable by anything that can exec into it or
#     read the pod spec. This Job holds them for ~10 seconds and exits.
#  2. `--import-realm` **skips a realm that already exists**, so placeholders only
#     ever apply on a first, empty-database boot. A rotated secret would need a
#     different mechanism anyway — and one mechanism beats two.
#
# This Job is therefore also the realm *mutation* path. It is idempotent: setting
# a secret to the value it already has is a no-op, and the assertions are reads.
#
# Secrets come from `keycloak-client-secrets` (ESO ->
# colx/dev/keycloak/client-*). Nothing here is templated from git.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-bootstrap
  namespace: platform
  labels:
    app.kubernetes.io/part-of: colx
    app.kubernetes.io/component: keycloak-bootstrap
spec:
  backoffLimit: 3
  # Keep the pod around long enough to read its log after a failed deploy.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: colx
        app.kubernetes.io/component: keycloak-bootstrap
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: kcadm
          # Same image as the server, so kcadm.sh is always the matching version.
          image: quay.io/keycloak/keycloak:26.6.4
          imagePullPolicy: IfNotPresent
          env:
            - name: KC_URL
              value: http://keycloak-http.platform.svc.cluster.local
            - name: KC_REALM
              value: colx
            - name: KCADM_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username
            - name: KCADM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
            - name: SECRET_PLATFORM_SERVICES
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-secrets
                  key: platform-services
            - name: SECRET_SIMULATOR
              valueFrom:
                secretKeyRef:
                  name: keycloak-client-secrets
                  key: simulator
          volumeMounts:
            - name: realm-import
              mountPath: /realm
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              KCADM=/opt/keycloak/bin/kcadm.sh

              echo "waiting for ${KC_URL}/realms/${KC_REALM} to answer"
              for i in $(seq 1 60); do
                if curl -sf "${KC_URL}/realms/${KC_REALM}/.well-known/openid-configuration" >/dev/null; then
                  break
                fi
                [ "$i" -eq 60 ] && { echo "FAIL: realm ${KC_REALM} never became available"; exit 1; }
                sleep 5
              done

              # Credentials go to a config file in the container's own filesystem
              # and die with the pod.
              "$KCADM" config credentials \
                --server "${KC_URL}" \
                --realm master \
                --user "${KCADM_USER}" \
                --password "${KCADM_PASSWORD}"

              set_secret() {
                local client_id="$1" secret="$2" id
                id="$("$KCADM" get clients -r "${KC_REALM}" -q "clientId=${client_id}" \
                        --fields id --format csv --noquotes)"
                if [ -z "$id" ]; then
                  echo "FAIL: client ${client_id} not found — realm import did not run?"
                  exit 1
                fi
                # `update` with only -s secret leaves every other attribute alone.
                # The value never reaches a log line: kcadm does not echo -s values.
                "$KCADM" update "clients/${id}" -r "${KC_REALM}" -s "secret=${secret}"
                echo "ok: client secret set for ${client_id}"
              }

              set_secret platform-services "${SECRET_PLATFORM_SERVICES}"
              set_secret simulator "${SECRET_SIMULATOR}"

              # ---- drift assertions -------------------------------------------
              # `--import-realm` skips an existing realm, so an edited
              # realm-colx.json is NOT picked up by a redeploy. Rather than let
              # that be a silent surprise, compare the counts and fail.
              expect_scopes="$(grep -o '"include.in.token.scope"' /realm/realm-colx.json | wc -l | tr -d ' ')"
              actual_scopes="$("$KCADM" get client-scopes -r "${KC_REALM}" \
                                 --fields name --format csv --noquotes | grep -c ':' || true)"
              echo "colon-form client scopes: file=${expect_scopes} realm=${actual_scopes}"
              if [ "${actual_scopes}" -lt "${expect_scopes}" ]; then
                echo "FAIL: realm ${KC_REALM} is missing client scopes present in realm-colx.json."
                echo "      --import-realm skips existing realms; see the runbook for the"
                echo "      documented re-import path (delete the realm, restart the StatefulSet)."
                exit 1
              fi

              for g in strategy-author business-approver risk-approver admin collector ops-admin analyst; do
                if ! "$KCADM" get groups -r "${KC_REALM}" --fields name --format csv --noquotes \
                     | grep -qx "$g"; then
                  echo "FAIL: group ${g} missing from realm ${KC_REALM}"
                  exit 1
                fi
              done
              echo "ok: 7 groups present"
              echo "keycloak-bootstrap: done"
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm
