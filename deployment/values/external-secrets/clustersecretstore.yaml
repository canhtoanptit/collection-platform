# The one and only secret store (plan FND-8).
#
# Applied by the external-secrets postsync hook, because it needs both the CRD
# (installed by that release) and the IRSA-annotated service account to exist.
#
# Auth is `jwt` with a serviceAccountRef, i.e. IRSA: ESO exchanges its projected
# service-account token for `colx-dev-external-secrets`, whose only permission is
# reading `colx/dev/*` (stack 30-eks, `policies.tf`). No access key exists.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: colx-dev
  labels:
    app.kubernetes.io/part-of: colx
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: platform
