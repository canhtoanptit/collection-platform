# Every Kubernetes Secret in the colx-dev cluster, in one file.
#
# This is deliberate. The convention "no secret values in git" (D§66) is easy to
# state and easy to erode; keeping every ExternalSecret in a single reviewable
# file means the answer to "what secrets does this cluster have, and where do they
# come from?" is `wc -l` on one file, and a new secret cannot appear without
# showing up in this diff.
#
# Applied by the external-secrets postsync hook, so the Secrets exist before the
# releases that mount them (kube-prometheus-stack, keycloak, airflow).
#
# AWS Secrets Manager entries this expects (created by INF-A's placeholders,
# values filled out of band — never by Terraform, never here):
#
#   colx/dev/grafana/admin                        {username, password}
#   colx/dev/keycloak/admin                       {username, password}
#   colx/dev/keycloak/db                           {password}
#   colx/dev/keycloak/client-platform-services     {secret}
#   colx/dev/keycloak/client-simulator             {secret}
#   colx/dev/airflow/metadata                      {connection}
#   colx/dev/airflow/fernet                        {fernet-key}
#   colx/dev/airflow/webserver                     {secret-key, admin-username, admin-password}
#   colx/dev/airflow/connections                   {AIRFLOW_CONN_INGESTION_CP, AIRFLOW_CONN_SNOWFLAKE_DEFAULT,
#                                                   AIRFLOW_VAR_ENVIRONMENT, AIRFLOW_VAR_S3_OPS_BUCKET}
#
# refreshInterval 1h: long enough to be quiet, short enough that a rotated value
# lands the same working day. A pod still needs a restart to pick up an env-var
# secret — that is the ESO caveat called out in ADR-0011.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: colx-dev
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: colx/dev/grafana/admin
        property: username
    - secretKey: admin-password
      remoteRef:
        key: colx/dev/grafana/admin
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-admin
  namespace: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: colx-dev
    kind: ClusterSecretStore
  target:
    name: keycloak-admin
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: colx/dev/keycloak/admin
        property: username
    - secretKey: password
      remoteRef:
        key: colx/dev/keycloak/admin
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db
  namespace: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: colx-dev
    kind: ClusterSecretStore
  target:
    name: keycloak-db
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: colx/dev/keycloak/db
        property: password
---
# Consumed by the kcadm Job, never by the Keycloak server: the client secrets are
# set through the admin API after startup, so they never enter the realm JSON and
# never sit in the long-lived server process's environment.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-client-secrets
  namespace: platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: colx-dev
    kind: ClusterSecretStore
  target:
    name: keycloak-client-secrets
    creationPolicy: Owner
  data:
    - secretKey: platform-services
      remoteRef:
        key: colx/dev/keycloak/client-platform-services
        property: secret
    - secretKey: simulator
      remoteRef:
        key: colx/dev/keycloak/client-simulator
        property: secret
---
# Airflow metadata DB. Key must be `connection` — the chart's
# `airflow.metadataSecretName` helper hard-codes that key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-metadata
  namespace: airflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: colx-dev
    kind: ClusterSecretStore
  target:
    name: airflow-metadata
    creationPolicy: Owner
  data:
    - secretKey: connection
      remoteRef:
        key: colx/dev/airflow/metadata
        property: connection
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-fernet-key
  namespace: airflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: colx-dev
    kind: ClusterSecretStore
  target:
    name: airflow-fernet-key
    creationPolicy: Owner
  data:
    # Key name fixed by the chart helper.
    - secretKey: fernet-key
      remoteRef:
        key: colx/dev/airflow/fernet
        property: fernet-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-webserver-secret-key
  namespace: airflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: colx-dev
    kind: ClusterSecretStore
  target:
    name: airflow-webserver-secret-key
    creationPolicy: Owner
  data:
    # Key name fixed by the chart helper.
    - secretKey: webserver-secret-key
      remoteRef:
        key: colx/dev/airflow/webserver
        property: secret-key
---
# The local admin the webserver's create-user Job provisions. The chart's default
# path puts the password in `values.yaml` (and therefore in git and in the Job's
# argv); values/airflow/dev.yaml overrides the Job args to read these instead.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-admin
  namespace: airflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: colx-dev
    kind: ClusterSecretStore
  target:
    name: airflow-admin
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: colx/dev/airflow/webserver
        property: admin-username
    - secretKey: password
      remoteRef:
        key: colx/dev/airflow/webserver
        property: admin-password
---
# Airflow Connections and Variables as `AIRFLOW_CONN_*` / `AIRFLOW_VAR_*` env
# vars. `dataFrom` copies every key in the Secrets Manager entry, so adding a
# connection is an out-of-band secret edit plus a pod restart — no chart change,
# and no connection URI in a DAG (A§42, CLAUDE.md hard rule 3).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-connections
  namespace: airflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: colx-dev
    kind: ClusterSecretStore
  target:
    name: airflow-connections
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: colx/dev/airflow/connections
