# ============================== unlisted WPs ===============================
#
# `_default` owns nothing, deliberately. There is no fallback: a WP id absent
# from this file is an error, and `check-ownership.sh` exits non-zero telling you
# to add it. Before delegating any WP (Phase 2 onward), the lead agent appends an
# entry here whose globs are exactly the "Deliverable paths" section of the WP
# brief (`docs/wp-template.md`) plus `scripts/verify/<WP-ID>.sh`, and commits it
# separately from the implementation. Reviewers reject WPs whose diff and
# ownership entry disagree.
_default:
