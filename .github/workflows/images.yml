# Container image build/push (plan FND-12).
#
# Three images, one per directory under deployment/images/. A change to one does
# not rebuild the others — `colx/airflow` is a ~1.5 GB base and rebuilding it
# because a dbt pin moved is minutes of nothing.
#
# Push happens on `main` only, via `colx-gha-ecr-push` federated with OIDC. There
# is no registry password in this repo (`gh secret list | grep -c AWS_SECRET` == 0
# is an ADR-0010 acceptance check).
#
# The trivy gate is a gate: HIGH and CRITICAL fail the job. A vulnerable image
# that "we'll fix next sprint" is an image running in the cluster.
name: images

on:
  pull_request:
    paths:
      - 'deployment/images/**'
      - '.github/workflows/images.yml'
  push:
    branches: [main]
    paths:
      - 'deployment/images/**'
      - '.github/workflows/images.yml'

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-west-1

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            airflow:
              - 'deployment/images/airflow/**'
            connect:
              - 'deployment/images/connect/**'
            dbt:
              - 'deployment/images/dbt/**'

  build:
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # PRs build but do not push: a fork PR must never be able to write to ECR,
      # and OIDC federation is scoped so it cannot.
      - name: configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/colx-gha-ecr-push
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-ecr-push-${{ matrix.image }}

      - name: login to ECR
        id: ecr
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2

      - name: compute tags
        id: tags
        run: |
          short="${GITHUB_SHA::12}"
          if [ "${{ github.event_name }}" = "push" ]; then
            registry='${{ steps.ecr.outputs.registry }}'
            # sha- tag is the one Helm releases reference; `latest` exists so a
            # `make up-all` on a fresh cluster has something to pull.
            echo "tags=${registry}/colx/${{ matrix.image }}:sha-${short},${registry}/colx/${{ matrix.image }}:latest" >> "$GITHUB_OUTPUT"
            echo "scan=${registry}/colx/${{ matrix.image }}:sha-${short}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "tags=colx/${{ matrix.image }}:pr-${short}" >> "$GITHUB_OUTPUT"
            echo "scan=colx/${{ matrix.image }}:pr-${short}" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      # Built once, loaded into the local daemon so trivy scans the exact bytes,
      # then pushed only if the scan passes. Building twice (once to scan, once to
      # push) would scan a different image than the one that ships.
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: deployment/images/${{ matrix.image }}
          push: false
          load: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false

      - name: trivy image scan (HIGH+ fails)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.tags.outputs.scan }}
          format: table
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          vuln-type: 'os,library'

      - name: push
        if: steps.tags.outputs.push == 'true'
        run: |
          IFS=',' read -ra tags <<< "${{ steps.tags.outputs.tags }}"
          for t in "${tags[@]}"; do
            echo "pushing $t"
            docker push "$t"
          done
