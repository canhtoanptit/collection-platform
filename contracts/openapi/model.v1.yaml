    ModelScore:
      type: object
      title: ModelScore
      description: >-
        The result of scoring one context document with one model version. The
        model echoes `modelId` and `version` back: decision-service records
        them in the audit row from the *response*, not from what it asked for,
        so a model server that served something other than the pinned version
        is detectable rather than invisible.
      additionalProperties: false
      required:
        - modelId
        - version
        - score
        - band
        - reasonCodes
      properties:
        modelId:
          type: string
          description: >-
            Model that produced the score — must equal the `{modelId}` path
            parameter.
          pattern: '^[A-Z][A-Z0-9_]{2,63}$'
          example: PAYMENT_PROPENSITY
        version:
          type: string
          description: >-
            Model version that produced the score — must equal the `{version}`
            path parameter. Carried into the decision audit's `model_versions`
            and into the A§16 `modelReferences` of the decision response.
          minLength: 1
          maxLength: 32
          example: '8'
        score:
          $ref: '#/components/schemas/Probability'
        band:
          type: string
          description: >-
            The band the score falls in, e.g. `HIGH`. Bands are a closed
            vocabulary published with each model version rather than a contract
            enum, because a risk model's bands and a propensity model's bands
            are different sets and adding an enum member to a released contract
            is a breaking change. Rules compare against bands rather than raw
            scores wherever possible — a threshold moves when a model is
            retrained, a band does not (A§58, plan DEC-8).
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
          example: HIGH
        reasonCodes:
          type: array
          description: >-
            Why the model produced this score, as codes from
            `contracts/registries/reason-codes.v1.json`. Never empty: A§58
            requires every decision to be explainable, and a score with no
            stated reason cannot contribute to an explanation. Merged into the
            decision's reason codes at the models stage, in the order returned.
          items:
            $ref: '#/components/schemas/ReasonCodeValue'
          minItems: 1
          maxItems: 20
      example:
        modelId: PAYMENT_PROPENSITY
        version: '8'
        score: '0.72'
        band: HIGH
        reasonCodes:
          - PAYMENT_PROPENSITY_0_72
          - NO_ACTIVE_ARRANGEMENT
