    put:
      operationId: replaceRuleSetVersionDefinition
      summary: Replace the definition of a DRAFT rule-set version
      description: >-
        Wholesale replacement of the version's rule or policy document.
        Editable only while the version is `DRAFT`; a `PUBLISHED` or `RETIRED`
        version is 409 `RULESET_PUBLISHED`.


        Required scope: `strategy-author` (or `admin`).


        The submitted document's `ruleSetId` and `kind` must match the
        resource; `version` in the body, if present, must equal `{version}`.
        Validation is identical to `POST /v1/rule-sets`.
      tags:
        - rule-sets
      requestBody:
        required: true
        description: The replacement rule-set document.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleSetDocument'
      responses:
        '200':
          description: The updated DRAFT version, with its recomputed content hash.
          headers:
            X-Correlation-Id:
              $ref: './common.v1.yaml#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleSetVersion'
        '400':
          $ref: './common.v1.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.v1.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.v1.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.v1.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.v1.yaml#/components/responses/Conflict'
        '422':
          $ref: './common.v1.yaml#/components/responses/UnprocessableEntity'
        '500':
          $ref: './common.v1.yaml#/components/responses/InternalError'

  /v1/rule-sets/{ruleSetId}/versions/{version}/publish:
    parameters:
      - $ref: '#/components/parameters/RuleSetIdPath'
      - $ref: '#/components/parameters/VersionPath'
      - $ref: './common.v1.yaml#/components/parameters/CorrelationId'
    post:
      operationId: publishRuleSetVersion
      summary: Publish a DRAFT rule-set version
      description: >-
        Moves the version from `DRAFT` to `PUBLISHED`, making it immutable and
        eligible to be referenced by a strategy's `ruleSetRef`. Re-publishing an
        already published version, or attempting to publish a `RETIRED` one, is
        409 `RULESET_PUBLISHED` — the same code the definition PUT returns, so a
        client has one thing to branch on for "this rule set is frozen".


        Required scope: `strategy-author` (or `admin`).


        Publication re-runs the full validation set (schema, field catalogue,
        reason-code registry, `FORBID_CHANNEL`-only-in-POLICY) because the
        catalogue and registry may have changed since the DRAFT was written,
        and emits `RuleSetPublished`.
      tags:
        - rule-sets
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        description: Optional publication comment recorded in the audit trail.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: The published, now immutable, rule-set version.
          headers:
            X-Correlation-Id:
              $ref: './common.v1.yaml#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleSetVersion'
        '400':
          $ref: './common.v1.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.v1.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.v1.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.v1.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.v1.yaml#/components/responses/Conflict'
        '422':
          $ref: './common.v1.yaml#/components/responses/UnprocessableEntity'
        '500':
          $ref: './common.v1.yaml#/components/responses/InternalError'

  # -------------------------------------------------------- guardrail configs
  /v1/guardrail-configs:
    parameters:
