      tags:
        - rule-sets
      responses:
        '200':
          description: The rule-set aggregate.
          headers:
            X-Correlation-Id:
              $ref: './common.v1.yaml#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleSet'
        '400':
          $ref: './common.v1.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.v1.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.v1.yaml#/components/responses/Forbidden'
        '404':
