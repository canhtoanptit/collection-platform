    post:
      operationId: createGuardrailConfig
      summary: Create a guardrail config, or a new DRAFT version of an existing one
      description: >-
        Same resource pattern as rule sets: version `1` `DRAFT` for a new
        `guardrailConfigId`, otherwise the next version number as `DRAFT`.
        Guardrail configs carry the per-channel contact windows and frequency
        caps that treatment-service re-evaluates immediately before dispatch
        (plan DEC-4/DEC-16) — they are execution guardrails, not decision
        logic, which is why they are a separate resource from policy rule sets.


        Required scope: `strategy-author` (or `admin`).


        Validation (400 `GUARDRAIL_DEFINITION_INVALID` with `details[]`): the
        document must satisfy
        `schemas/decisioning/guardrail-config.v1.json`; contact windows must
        not be empty for a channel that any frequency cap references; `from`
