# =============================================================================
# Collections Platform — strategy-service API (DEC-1)
# =============================================================================
# Owns `/v1/strategies*`, `/v1/rule-sets*` and `/v1/guardrail-configs*`
# (contracts/README.md "URL path-ownership matrix"). Decision execution lives in
# `decision.v1.yaml`; this spec is the *authoring and governance* surface only —
# nothing here evaluates a strategy.
#
# Source: A§53 (strategy object), A§54 (policy precedence), A§55 (rule engine),
# A§60 (strategy governance lifecycle), D§7 (strategy management), D§77
# (strategy lifecycle), plan §7 DEC-1/DEC-2/DEC-3/DEC-4.
#
# SELF-CONTAINED BY DESIGN: the strategy document, rule-set document, guardrail
# config and condition grammar are declared inline as component schemas rather
# than `$ref`-ing `contracts/schemas/decisioning/*.json`. oapi-codegen cannot
# follow a JSON-Schema `$ref` out of an OpenAPI document, and the strict-server
# contract must be a compile-time artefact (CLAUDE.md §4). The normative
# documents remain:
#
#   contracts/schemas/decisioning/strategy-document.v1.json
#   contracts/schemas/decisioning/rule-set.v1.json
#   contracts/schemas/decisioning/guardrail-config.v1.json
#   contracts/schemas/decisioning/context-field-catalogue.v1.json
#
# and strategy-service validates every submitted definition against them at
# runtime (embedded FS, `platform/events`-style loader). Field shapes here are
# kept identical to those schemas; a divergence is a bug in whichever file
# drifted.
#
# RELEASED FILE — IMMUTABLE once on `main`. Any change a consumer could notice
# ships as `strategy.v2.yaml`. See contracts/README.md §1.
#
# Vocabulary policy (same as the wave-A specs): closed state machines defined by
# the design pack are `enum`s; vocabularies that are reference data owned by a
# service (segments, product codes, delinquency buckets, reason codes, model
# ids) are pattern-constrained strings, because adding an enum member to a
# released contract is a breaking change.
# =============================================================================

openapi: 3.0.3

info:
  title: Collections Platform — Strategy Service API
  version: 1.0.0
  description: >-
    Authoring, versioning and governance of collections decisioning
    configuration: strategies (A§53), rule sets and policy sets (A§55), and
    execution guardrail configs. Every artefact is immutable once it leaves
    DRAFT, versioned independently, and moves through the A§60 lifecycle under
    an append-only audit trail (CLAUDE.md hard rule 4).


    Conventions (normative: `contracts/README.md`): A§20 error body on every
    non-2xx response, `Idempotency-Key` on every POST command (A§21),
    `X-Correlation-Id` accepted on every request and echoed on every response
    (A§97), RFC3339 UTC timestamps, `limit` + opaque `cursor` pagination.


    Money never appears on this API as a scalar amount. The only monetary
    values in the decisioning contracts are inside a **context document**, and
    they are decimal strings in *major* units (`"500"`, not `50000`) so that
    business rules authored by non-engineers read the same numbers the business
    uses — the single documented exception to the platform's int64-minor-units
    rule (contracts/README.md §4, plan §2). Strategy and rule-set definitions
    only ever *compare against* those context fields, so any threshold written
    in a condition leaf is a decimal string in major units too.


    Authorization is a per-service JWT with deny-by-default scope checks. The
    scope each operation requires is stated in its description. The governance
    roles are `strategy-author`, `business-approver`, `risk-approver` and
    `admin` (Cognito groups, FND-6).
  license:
    name: Apache-2.0

servers:
  - url: https://api.collections.internal
    description: >-
      API gateway host (A§64). No ingress exists before Phase 12 of the
      implementation plan; until then the service is reached directly.
  - url: http://localhost:8080
    description: Local development (`make -C services/strategy run`, compose stack, port-forward).

security:
  - bearerAuth: []

tags:
  - name: strategies
    description: >-
      Strategy aggregates and their immutable versions — create, clone, edit a
      DRAFT definition, read the ACTIVE set (A§53, plan DEC-2).
  - name: strategy-governance
    description: >-
      The A§60 lifecycle: state transitions, dual approvals, and the
      append-only audit of who moved what, when, against which content hash
      (plan DEC-3).
  - name: rule-sets
    description: >-
      Versioned rule and policy documents evaluated by the decision pipeline.
      Immutable once published (A§55, plan DEC-4).
  - name: guardrail-configs
    description: >-
      Versioned execution guardrails — per-channel contact windows and
      frequency caps enforced by treatment-service before dispatch (plan
      DEC-4/DEC-16).

paths:
  # --------------------------------------------------------------- strategies
  /v1/strategies:
    parameters:
      - $ref: './common.v1.yaml#/components/parameters/CorrelationId'
    post:
      operationId: createStrategy
      summary: Create a strategy and its first DRAFT version
      description: >-
        Creates the strategy aggregate identified by the submitted definition's
        `id`, together with version `1` in state `DRAFT`. The body is a full
        strategy document (A§53); it is validated against
        `schemas/decisioning/strategy-document.v1.json` and rejected with 400
        `STRATEGY_DEFINITION_INVALID` — including a `details[]` entry per
        offending field — when a field is unknown, a referenced context field
        is absent from the field catalogue, or `experiment.arms[].percentBps`
        does not sum to 10000.


        Required scope: `strategy-author` (or `admin`).


        Creating a strategy whose `id` already exists is 409
        `STRATEGY_EXISTS`: subsequent versions are created with
        `POST /v1/strategies/{strategyId}/versions`.
      tags:
        - strategies
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: The initial strategy document. Its `id` becomes `strategyId`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyDocument'
      responses:
        '201':
          description: The created strategy version — always version 1, state DRAFT.
          headers:
            X-Correlation-Id:
              $ref: './common.v1.yaml#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyVersion'
        '400':
          $ref: './common.v1.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.v1.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.v1.yaml#/components/responses/Forbidden'
        '409':
          $ref: './common.v1.yaml#/components/responses/Conflict'
        '422':
          $ref: './common.v1.yaml#/components/responses/UnprocessableEntity'
        '500':
          $ref: './common.v1.yaml#/components/responses/InternalError'
    get:
      operationId: listStrategies
      summary: List strategies
      description: >-
        Lists strategy aggregates, newest first by creation time. `status`
        filters to strategies that currently have at least one version in that
        state, which is how the workbench renders the "awaiting my approval"
        queues.


        Required scope: any governance role — `strategy-author`,
        `business-approver`, `risk-approver` or `admin`.
      tags:
        - strategies
      parameters:
        - name: status
          in: query
          required: false
          description: >-
            Return only strategies having at least one version in this
            lifecycle state. Omit for all strategies.
          schema:
            $ref: '#/components/schemas/StrategyState'
        - $ref: './common.v1.yaml#/components/parameters/Limit'
        - $ref: './common.v1.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of strategies.
          headers:
            X-Correlation-Id:
              $ref: './common.v1.yaml#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyPage'
        '400':
          $ref: './common.v1.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.v1.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.v1.yaml#/components/responses/Forbidden'
        '500':
          $ref: './common.v1.yaml#/components/responses/InternalError'

  /v1/strategies/active:
    parameters:
      - $ref: './common.v1.yaml#/components/parameters/CorrelationId'
    get:
      operationId: listActiveStrategies
      summary: List the strategy versions active on a date
      description: >-
        Returns the ACTIVE version of every strategy whose effective window
        contains `onDate`. This is the config-cache load performed by
        decision-service at start-up and after every `StrategyStateChanged`
        event (plan DEC-6); it is also how an auditor reconstructs the strategy
        set that was live on a past business date.


        At most one version of a strategy is ACTIVE at any time — enforced in
        the store by a partial unique index on `(strategy_id) WHERE status =
        'ACTIVE'` — so this list has at most one entry per `strategyId`.
        Entries are ordered by descending `definition.priority` then ascending
        `strategyId`, which is exactly the strategy-selection order the decision
        pipeline applies (highest priority wins, ties broken
        lexicographically).


        Required scope: any governance role, or `decisions:write` for the
        decision-service service identity.
      tags:
        - strategies
      parameters:
        - name: onDate
          in: query
          required: false
          description: >-
            Business date to evaluate the effective window against
            (`YYYY-MM-DD`). Defaults to today in UTC. A future date returns the
            set that *will* be active then only insofar as versions are already
            ACTIVE — SCHEDULED versions are not included, because they are not
            yet decisions the platform would make.
          schema:
            type: string
            format: date
            example: '2026-08-22'
        - $ref: './common.v1.yaml#/components/parameters/Limit'
        - $ref: './common.v1.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of ACTIVE strategy versions, in selection order.
          headers:
            X-Correlation-Id:
              $ref: './common.v1.yaml#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyVersionPage'
        '400':
          $ref: './common.v1.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.v1.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.v1.yaml#/components/responses/Forbidden'
        '500':
          $ref: './common.v1.yaml#/components/responses/InternalError'

  /v1/strategies/{strategyId}:
    parameters:
      - $ref: '#/components/parameters/StrategyIdPath'
      - $ref: './common.v1.yaml#/components/parameters/CorrelationId'
    get:
      operationId: getStrategy
      summary: Get a strategy aggregate
      description: >-
        Returns the strategy aggregate: its name, the highest version number
        that exists, and which version (if any) is currently ACTIVE. The
        definitions themselves live on the version resources.


        Required scope: any governance role.
      tags:
        - strategies
      responses:
        '200':
          description: The strategy aggregate.
          headers:
            X-Correlation-Id:
              $ref: './common.v1.yaml#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Strategy'
        '400':
          $ref: './common.v1.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.v1.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.v1.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.v1.yaml#/components/responses/NotFound'
        '500':
          $ref: './common.v1.yaml#/components/responses/InternalError'

  /v1/strategies/{strategyId}/versions:
    parameters:
      - $ref: '#/components/parameters/StrategyIdPath'
      - $ref: './common.v1.yaml#/components/parameters/CorrelationId'
    get:
      operationId: listStrategyVersions
      summary: List the versions of a strategy
      description: >-
        Every version ever created for this strategy, newest version number
        first, each with its lifecycle state and content hash. Versions are
        never deleted: a rejected or retired version stays readable forever
        because a decision audit row may reference it (D§39).


        Required scope: any governance role.
      tags:
        - strategies
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/Limit'
        - $ref: './common.v1.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of strategy versions, highest version first.
          headers:
            X-Correlation-Id:
              $ref: './common.v1.yaml#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyVersionPage'
        '400':
          $ref: './common.v1.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.v1.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.v1.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.v1.yaml#/components/responses/NotFound'
        '500':
          $ref: './common.v1.yaml#/components/responses/InternalError'
    post:
      operationId: createStrategyVersion
      summary: Clone the latest version into a new DRAFT
      description: >-
        Creates the next version number by copying the definition of the
        highest existing version verbatim, in state `DRAFT`. This is the only
        way to change a strategy that has left DRAFT: released versions are
        immutable so that every decision audit row keeps pointing at exactly
        the definition that produced it.


        Required scope: `strategy-author` (or `admin`).


        The request body is optional; supply `sourceVersion` to clone something
        other than the latest. Cloning does not carry over lifecycle state,
        approvals or the frozen content hash — the new version starts clean at
        DRAFT.
      tags:
        - strategies
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        description: Which version to clone from, and an optional comment for the audit trail.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStrategyVersionRequest'
      responses:
        '201':
          description: The newly created DRAFT version.
          headers:
            X-Correlation-Id:
              $ref: './common.v1.yaml#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyVersion'
        '400':
          $ref: './common.v1.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.v1.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.v1.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.v1.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.v1.yaml#/components/responses/Conflict'
        '422':
          $ref: './common.v1.yaml#/components/responses/UnprocessableEntity'
        '500':
          $ref: './common.v1.yaml#/components/responses/InternalError'

  /v1/strategies/{strategyId}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/StrategyIdPath'
      - $ref: '#/components/parameters/VersionPath'
      - $ref: './common.v1.yaml#/components/parameters/CorrelationId'
    get:
      operationId: getStrategyVersion
      summary: Get one strategy version with its full definition
      description: >-
        Returns the version, its lifecycle state, its content hash and the
        complete strategy document. The content hash is the SHA-256 of the
        canonicalised definition and is what simulation records and the
        governance state machine key on — a definition edit changes the hash and
        invalidates any simulation performed against the old one.


        Required scope: any governance role, or `decisions:write` for the
        decision-service service identity loading its config cache.
      tags:
        - strategies
      responses:
        '200':
          description: The strategy version and its definition.
          headers:
            X-Correlation-Id:
              $ref: './common.v1.yaml#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyVersion'
        '400':
          $ref: './common.v1.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.v1.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.v1.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.v1.yaml#/components/responses/NotFound'
        '500':
          $ref: './common.v1.yaml#/components/responses/InternalError'

  /v1/strategies/{strategyId}/versions/{version}/definition:
    parameters:
      - $ref: '#/components/parameters/StrategyIdPath'
      - $ref: '#/components/parameters/VersionPath'
      - $ref: './common.v1.yaml#/components/parameters/CorrelationId'
    put:
      operationId: replaceStrategyVersionDefinition
      summary: Replace the definition of an editable strategy version
      description: >-
        Wholesale replacement of the version's strategy document. Editable only
        while the version is in `DRAFT` or `TEST`; any other state is 409
        `STRATEGY_NOT_EDITABLE` — that is the mechanism that makes an approved
        or active strategy tamper-proof (A§60, plan DEC-2/DEC-3).


        Required scope: `strategy-author` (or `admin`).


        The submitted document's `id` must equal `{strategyId}`; a mismatch is
        400 `STRATEGY_DEFINITION_INVALID`. On success the content hash is
        recomputed, which deliberately invalidates any simulation record taken
        against the previous hash — a version cannot reach `SIMULATED` on the
        strength of a simulation of different content.


        No `If-Match` is required: this is a full replacement of a definition
        that only its author's role may touch, and every change is recorded in
        the append-only transition/audit trail. PATCH semantics (and therefore
        row-version preconditions) are deliberately not offered for strategy
        documents — partial edits of a rule tree are how production strategies
        get silently broken.
      tags:
        - strategies
      requestBody:
        required: true
        description: The replacement strategy document.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyDocument'
      responses:
        '200':
          description: The updated version, with its recomputed content hash.
          headers:
            X-Correlation-Id:
              $ref: './common.v1.yaml#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyVersion'
        '400':
          $ref: './common.v1.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.v1.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.v1.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.v1.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.v1.yaml#/components/responses/Conflict'
        '422':
          $ref: './common.v1.yaml#/components/responses/UnprocessableEntity'
        '500':
          $ref: './common.v1.yaml#/components/responses/InternalError'

  # ------------------------------------------------------ strategy governance
  /v1/strategies/{strategyId}/versions/{version}/transitions:
    parameters:
      - $ref: '#/components/parameters/StrategyIdPath'
      - $ref: '#/components/parameters/VersionPath'
      - $ref: './common.v1.yaml#/components/parameters/CorrelationId'
    post:
      operationId: createStrategyTransition
      summary: Move a strategy version to the next lifecycle state
      description: >-
        Requests the A§60 transition to `toState`. Legal edges, and the role
        that may drive each one, are:


        | from | to | required role | additional guard |
        |---|---|---|---|
        | `DRAFT` | `TEST` | `strategy-author` | every `ruleSetRef` and
        `modelRefs[]` reference resolves, and the referenced rule set version is
        `PUBLISHED` |
        | `TEST` | `DRAFT` | `strategy-author` | — (re-open for editing; the
        content hash is not yet frozen) |
        | `TEST` | `SIMULATED` | `admin`, or the decision-service system
        identity | **content hash is frozen here** and a *completed* simulation
        record must exist for exactly that hash (`SIMULATION_REQUIRED`
        otherwise); feature-flagged off until DEC-12 ships |
        | `SIMULATED` | `BUSINESS_APPROVED` | `business-approver` | approver
        must not be the author of the version |
        | `SIMULATED` | `REJECTED` | `business-approver` or `admin` | — |
        | `BUSINESS_APPROVED` | `RISK_APPROVED` | `risk-approver` | approver
        must not be the author, and must not be the business approver |
        | `BUSINESS_APPROVED` | `REJECTED` | `risk-approver` or `admin` | — |
        | `RISK_APPROVED` | `SCHEDULED` | `strategy-author` or `admin` |
        `definition.effectiveFrom` must be today or later |
        | `SCHEDULED` | `ACTIVE` | `admin`, or the activation scheduler | any
        previously ACTIVE version of the same strategy is RETIRED in the same
        transaction |
        | `ACTIVE` | `RETIRED` | `admin` | — |
        | `REJECTED` | `DRAFT` | `strategy-author` | — (rework a rejected
        version) |


        Anything not in that table is 409 `STRATEGY_TRANSITION_INVALID` and
        changes nothing. A caller holding the wrong role gets 403, and so does
        an approver who authored the version — the approver-is-not-author rule
        is a 403 `APPROVER_IS_AUTHOR`, not a 409, because it is an
        authorization failure about *who* is asking rather than about the state
        of the resource.


        Required scope: as per the table above; `admin` may drive any edge that
        names it.


        Every accepted request appends one row to the append-only transition
        log and emits `StrategyStateChanged`; activation additionally emits
        `StrategyActivated` and `StrategyRetired` for the version it displaced.
        Approval edges also append to the approval log returned by
        `GET .../approvals`.
      tags:
        - strategy-governance
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Target state and the reviewer's comment.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrategyTransitionRequest'
      responses:
        '201':
          description: The recorded transition.
          headers:
            X-Correlation-Id:
              $ref: './common.v1.yaml#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyTransition'
        '400':
          $ref: './common.v1.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.v1.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.v1.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.v1.yaml#/components/responses/NotFound'
        '409':
          $ref: './common.v1.yaml#/components/responses/Conflict'
        '422':
          $ref: './common.v1.yaml#/components/responses/UnprocessableEntity'
        '500':
          $ref: './common.v1.yaml#/components/responses/InternalError'
    get:
      operationId: listStrategyTransitions
      summary: List the transition audit trail of a strategy version
      description: >-
        The append-only history of every state change applied to this version,
        oldest first — actor, roles held at the time, comment and the content
        hash that was in force. INSERT + SELECT only: there is no API, and no
        database grant, that can amend or remove a row (CLAUDE.md hard rule 4,
        D§39).


        Required scope: any governance role. Read access is deliberately broad:
        an auditor must be able to reconstruct a governance history without
        write privileges.
      tags:
        - strategy-governance
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/Limit'
        - $ref: './common.v1.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of transitions, oldest first.
          headers:
            X-Correlation-Id:
              $ref: './common.v1.yaml#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyTransitionPage'
        '400':
          $ref: './common.v1.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.v1.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.v1.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.v1.yaml#/components/responses/NotFound'
        '500':
          $ref: './common.v1.yaml#/components/responses/InternalError'

  /v1/strategies/{strategyId}/versions/{version}/approvals:
    parameters:
      - $ref: '#/components/parameters/StrategyIdPath'
      - $ref: '#/components/parameters/VersionPath'
      - $ref: './common.v1.yaml#/components/parameters/CorrelationId'
    get:
      operationId: listStrategyApprovals
      summary: List the recorded approvals of a strategy version
      description: >-
        The business and risk approvals granted for this version, oldest first,
        each pinned to the content hash that was approved. A version that
        reached `RISK_APPROVED` has exactly two rows by two distinct actors,
        neither of whom authored the version — that is the evidence a regulator
        asks for, so the rows are append-only like the transitions.


        Required scope: any governance role.
      tags:
        - strategy-governance
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/Limit'
        - $ref: './common.v1.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of approvals, oldest first.
          headers:
            X-Correlation-Id:
              $ref: './common.v1.yaml#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrategyApprovalPage'
        '400':
          $ref: './common.v1.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.v1.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.v1.yaml#/components/responses/Forbidden'
        '404':
          $ref: './common.v1.yaml#/components/responses/NotFound'
        '500':
          $ref: './common.v1.yaml#/components/responses/InternalError'

  # ---------------------------------------------------------------- rule sets
  /v1/rule-sets:
    parameters:
      - $ref: './common.v1.yaml#/components/parameters/CorrelationId'
    post:
      operationId: createRuleSet
      summary: Create a rule set, or a new DRAFT version of an existing one
      description: >-
        Creates version `1` in state `DRAFT` for a new `ruleSetId`. When the
        `ruleSetId` already exists the next version number is created instead,
        also as `DRAFT` — published versions are immutable, so a new version is
        the only way to change a rule set. `kind` must match the existing rule
        set's kind; changing it is 422 `RULESET_KIND_IMMUTABLE`.


        Required scope: `strategy-author` (or `admin`).


        Validation (400 `RULESET_DEFINITION_INVALID` with `details[]`): the
        document must satisfy `schemas/decisioning/rule-set.v1.json`; every
        `when` leaf `field` must exist in
        `schemas/decisioning/context-field-catalogue.v1.json`; every
        `then.reasonCode` must exist in `registries/reason-codes.v1.json`; and
        `FORBID_CHANNEL` outcomes are accepted only when `kind` is `POLICY`
        (A§54 — policy narrows, rules select).
      tags:
        - rule-sets
      parameters:
        - $ref: './common.v1.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: The rule-set document to store as a new DRAFT version.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleSetDocument'
      responses:
        '201':
          description: The created DRAFT rule-set version.
          headers:
            X-Correlation-Id:
              $ref: './common.v1.yaml#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleSetVersion'
        '400':
          $ref: './common.v1.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.v1.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.v1.yaml#/components/responses/Forbidden'
        '409':
          $ref: './common.v1.yaml#/components/responses/Conflict'
        '422':
          $ref: './common.v1.yaml#/components/responses/UnprocessableEntity'
        '500':
          $ref: './common.v1.yaml#/components/responses/InternalError'
    get:
      operationId: listRuleSets
      summary: List rule sets
      description: >-
        Lists rule-set aggregates, newest first by creation time, optionally
        filtered by `kind` and by whether a version in a given status exists.


        Required scope: any governance role, or `decisions:write` for the
        decision-service service identity.
      tags:
        - rule-sets
      parameters:
        - name: kind
          in: query
          required: false
          description: Restrict to rule sets of this kind. Omit for both kinds.
          schema:
            $ref: '#/components/schemas/RuleSetKind'
        - name: status
          in: query
          required: false
          description: >-
            Return only rule sets having at least one version in this status.
            Omit for all rule sets.
          schema:
            $ref: '#/components/schemas/PublishableState'
        - $ref: './common.v1.yaml#/components/parameters/Limit'
        - $ref: './common.v1.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of rule sets.
          headers:
            X-Correlation-Id:
              $ref: './common.v1.yaml#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleSetPage'
        '400':
          $ref: './common.v1.yaml#/components/responses/BadRequest'
        '401':
          $ref: './common.v1.yaml#/components/responses/Unauthorized'
        '403':
          $ref: './common.v1.yaml#/components/responses/Forbidden'
        '500':
          $ref: './common.v1.yaml#/components/responses/InternalError'

  /v1/rule-sets/{ruleSetId}:
    parameters:
      - $ref: '#/components/parameters/RuleSetIdPath'
