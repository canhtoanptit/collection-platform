x-dead-letter-queues:
  description: |
    A§27 convention, machine-readable. DLQs are not channels in this index: they are per consumer,
    they carry the failed message rather than a contract of their own, and their names are derived.
  domainServices:
    addressPattern: collections.dlq.{service}
    description: One per domain-service consumer group; `{service}` is the deployable name, e.g. collections.dlq.case-service.
  ingestion:
    address: dlq.ingestion.v1
    description: One for the whole ingestion plane (control plane, workers, canonicalizer).
  policy: retry with backoff, then DLQ, then alert, investigate, replay — never block a partition, never drop.
  valuePreserved: The original EventEnvelope.v1 document, byte for byte, so a replay is indistinguishable from the first delivery.
  headers:
    - x-original-topic
    - x-original-partition
    - x-original-offset
    - x-error-code
    - x-error-message
    - x-retry-count
    - correlationId

x-internal-topics:
  description: |
    Raw topics internal to `ingestion/`, listed here so nobody mistakes their absence for an
    omission. They carry no platform contract and no domain service may consume them (plan §6.2).
  topics:
    - address: cdc.corebank.public.cb_*
      description: Debezium change events from the corebank Postgres. Shape is Debezium's, not ours.
    - address: cdc.corebank.schema-history
      description: Debezium schema history (compacted, single partition).
    - address: connect.offsets, connect.configs, connect.status
      description: Kafka Connect internal topics.
    - address: ingestion.webhook.payment.v1
      description: Raw provider payment webhook, schema ../schemas/ingestion/PaymentWebhook.v1.json.
