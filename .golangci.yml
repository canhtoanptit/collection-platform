version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - copyloopvar
    - exhaustive # state-machine switches must cover every state
    - misspell
    - nolintlint
    - unconvert
    - unparam
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    nolintlint:
      require-explanation: true
  exclusions:
    generated: lax
    paths:
      - ".*/gen/.*"

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/canhtoanptit/collection-platform
